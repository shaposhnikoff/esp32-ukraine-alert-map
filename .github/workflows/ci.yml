name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev
      - name: Typecheck, lint and geometry tests
        working-directory: tools/map
        run: bun install --frozen-lockfile && bun run check
      - name: Configure
        run: uv tool run --from cmake==3.31.6 cmake -S simulator -B build-sim
      - name: Build
        run: uv tool run --from cmake==3.31.6 cmake --build build-sim --parallel
      - name: Test
        run: uv tool run --from cmake==3.31.6 ctest --test-dir build-sim --output-on-failure
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.2
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exact-board firmware build without private credentials
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # The image bundles 2.4.2, which can resolve a second LVGL version.
          python -m pip install --disable-pip-version-check 'idf-component-manager==2.5.2'
          lock_checksum="$(sha256sum dependencies.lock)"
          idf.py -B build-firmware build
          printf '%s\n' "$lock_checksum" | sha256sum --check
